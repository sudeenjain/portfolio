    <!-- Certificate Lightbox Modal -->
    <div class="cert-lightbox" id="certLightbox">
        <div class="cert-lightbox-backdrop" onclick="closeCertLightbox()"></div>
        <div class="cert-lightbox-content">
            <button class="cert-lightbox-close" onclick="closeCertLightbox()" title="Close"><i
                    class="fas fa-times"></i></button>
            <div class="cert-lightbox-layout">
                <div class="cert-lightbox-img-wrapper">
                    <img id="certLightboxImg" src="" alt="Certificate">
                </div>
                <div class="cert-lightbox-info-pane">
                    <h3 id="certLightboxTitle"></h3>
                    <div class="cert-lightbox-meta">
                        <span id="certLightboxCategory"><i class="fas fa-certificate"></i> <span></span></span>
                        <span id="certLightboxOrg"><i class="fas fa-building"></i> <span></span></span>
                        <span id="certLightboxDate"><i class="fas fa-calendar-alt"></i> <span></span></span>
                        <span id="certLightboxId"><i class="fas fa-id-card"></i> ID: <span></span></span>
                    </div>
                    <p id="certLightboxDesc" class="cert-lightbox-desc"></p>
                    <a id="certLightboxLink" href="" target="_blank" class="btn btn-filled">Verify Credential <i
                            class="fas fa-external-link-alt"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Tell renderer to resolve asset paths relative to parent root -->

    <!-- GSAP 3.13.0 + ScrollTrigger (vendored so the page works offline / without a CDN) -->
    <script src="js/vendor/lenis.min.js"></script>
    <script src="js/vendor/gsap.min.js"></script>
    <script src="js/vendor/ScrollTrigger.min.js"></script>
    <script src="js/laptop.js"></script>
    <script src="js/story.js"></script>
    <!-- Scroll-driven Three.js scene (module; Three.js is vendored in js/vendor so no CDN is needed) -->
    <script>
        /* The 670 KB Three.js scene loads only after the page is interactive, so it never delays first paint. */
        (function () {
            function load() { import('./js/scene3d.js').catch(function (e) { if (window.console) console.warn('[3d] not loaded', e); }); }
            function idle() { (window.requestIdleCallback || function (f) { setTimeout(f, 400); })(load, { timeout: 2500 }); }
            if (document.readyState === 'complete') idle(); else window.addEventListener('load', idle);
        })();
    </script>
    <!-- Abhimo-Style AI Chatbot Floating Widget -->
    <script src="../chatbot/sudeen-chatbot.js"></script>
